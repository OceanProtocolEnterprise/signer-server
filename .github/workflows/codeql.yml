name: CodeQL

on:
  push:
    branches:
      - main
      - develop
      - feat/**

  pull_request:
    branches:
      - main
      - feat/**

  schedule:
    - cron: "0 3 * * 1"

jobs:
  analyze:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      matrix:
        language:
          - javascript-typescript

    steps:
      - uses: actions/checkout@v4

      - uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}

      - run: npm ci

      - run: npm run build

      - uses: github/codeql-action/analyze@v3
