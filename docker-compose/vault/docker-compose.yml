services:
  openbao:
    build:
      context: ./openbao
      dockerfile: Dockerfile
    container_name: openbao
    restart: unless-stopped
    ports:
      - '${OPENBAO_PORT:-8200}:8200'
    environment:
      PRIVATE_KEYS_FILE: /run/secrets/private_keys
      PERSISTENT_PRIVATE_KEYS_FILE: /run/secrets/private_keys
      OPENBAO_TLS_DISABLE: ${OPENBAO_TLS_DISABLE:-false}
      # To use your own TLS certificate instead of the auto-generated self-signed one,
      # uncomment and set these to the paths of your cert and key files inside the container.
      # TLS_CERT_SOURCE: /path/to/tls.crt
      # TLS_KEY_SOURCE: /path/to/tls.key
    volumes:
      - openbao-data:/bao/data
      - openbao-keys:/vault/keys
      - openbao-tls:/etc/openbao/tls
      - ./openbao/secrets/private_keys:/run/secrets/private_keys
    healthcheck:
      # Uses -tls-skip-verify because the cert is self-signed by default.
      # If you supply a trusted CA cert, remove that flag.
      test: ['CMD', 'bao', 'status', '-tls-skip-verify']
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  signer-server:
    image: oceanenterprise/signer-server:latest
    pull_policy: missing
    container_name: ocean-signer-server
    restart: unless-stopped
    build:
      context: ../../
      dockerfile: Dockerfile
    depends_on:
      openbao:
        condition: service_healthy
    ports:
      - '${SIGNER_PORT:-8443}:3001'
    env_file:
      - .env
    environment:
      SIGNER_MODE: vault
    volumes:
      - ./certs:/etc/ssl/certs:ro
      - openbao-tls:/etc/openbao/tls:ro
      - openbao-keys:/vault/keys:ro
    command:
      - sh
      - -c
      - |
        echo "[signer-server] waiting for OpenBao to be ready..."
        # Wait for OpenBao to be healthy (handled by depends_on)
        echo "[signer-server] waiting for OpenBao root token..."
        until [ -s /vault/keys/root_token ]; do
          sleep 2
        done
        # Get token from mounted volume
        export VAULT_TOKEN="$$(cat /vault/keys/root_token)"
        # If TLS is disabled, don't set NODE_EXTRA_CA_CERTS
        if [ "${OPENBAO_TLS_DISABLE:-false}" = "true" ]; then
          echo "[signer-server] TLS disabled, using HTTP"
        else
          echo "[signer-server] TLS enabled, using HTTPS with CA certs"
          export NODE_EXTRA_CA_CERTS=/etc/openbao/tls/tls.crt
        fi
        echo "[signer-server] starting with VAULT_URL=$$VAULT_URL"
        exec node dist/main.js
volumes:
  openbao-data:
  openbao-keys:
  openbao-tls:
