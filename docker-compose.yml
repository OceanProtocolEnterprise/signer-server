services:
  signer-server:
    image: oceanenterprise/signer-server:latest
    pull_policy: always
    container_name: ocean-signer-server
    ports:
      - '8443:3001'
    env_file:
      - .env
    environment:
      NODE_ENV: production
    volumes:
      - ./certs:/etc/ssl/certs:ro
    restart: unless-stopped
